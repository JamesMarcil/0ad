networks:
  monitoring:
    driver: bridge

volumes:
  loki_data:
    name: 0ad_loki_data
  grafana_data:
    name: 0ad_grafana_data
  alloy_data:
    name: 0ad_alloy_data

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: 0ad-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.0
    container_name: 0ad-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_EXPLORE_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: 0ad-alloy
    restart: unless-stopped
    ports:
      - "12345:12345" # Alloy UI / diagnostics
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Mount 0 A.D. local logs directory into the container
      # On Windows (Docker Desktop default):
      - ${LOCALAPPDATA}/0ad/logs:/var/log/0ad:ro
      # For Linux / macOS hosts, adjust the path:
      # - ~/.local/state/0ad/log:/var/log/0ad:ro
    depends_on:
      - loki
    networks:
      - monitoring
